name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20      
      - name: Install pnpm
        run: npm install -g pnpm
      - run: pnpm install --config.allowBuilds=better-sqlite3,esbuild,sharp,yarn && pnpm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBEWALL_96C78 }}
          channelId: live
          projectId: webewall-96c78
          entryPoint: .
